version: '3.8'

services:
  # 1. Zookeeper (Required for Kafka Broker)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: rag-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # 2. Apache Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: rag-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # 3. Infisical (Open Source Secret Management Vault)
  infisical:
    image: infisical/infisical:latest
    container_name: rag-infisical
    environment:
      - PORT=8080
      - NODE_ENV=production
    ports:
      - "8080:8080"

  # 4. Express TypeScript Backend Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: rag-server
    depends_on:
      - kafka
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - KAFKA_BROKERS=kafka:29092
      - INFISICAL_SITE_URL=http://infisical:8080
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}

  # 5. React Vite Frontend Client (Nginx Web Server)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: rag-client
    depends_on:
      - server
    ports:
      - "80:80"
